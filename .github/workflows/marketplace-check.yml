name: Marketplace checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used for a manually dispatched release-candidate check
        required: true
        default: refa/marketplace-v3
        type: string

permissions:
  contents: read

jobs:
  marketplace-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every proposed marketplace snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DISPATCH_BASE_REF: ${{ inputs.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ -n "$DISPATCH_BASE_REF" ]]; then
            git check-ref-format --branch "$DISPATCH_BASE_REF" >/dev/null
            git fetch origin "refs/heads/$DISPATCH_BASE_REF:refs/remotes/origin/$DISPATCH_BASE_REF"
            base_sha="$(git rev-parse "origin/$DISPATCH_BASE_REF")"
          fi
          node scripts/check-marketplace-version.mjs --range "$base_sha" "$HEAD_SHA"

      - name: Test version guard and marketplace contracts
        run: node --test tests/marketplace-version.test.mjs tests/marketplace.test.mjs tests/update-cli-proxy-api.test.mjs

      # 通用身份对账：条目 version 必须等于包里的版本，plugin 的 entry/styles 必须真实存在。
      # 现有 tests/marketplace.test.mjs 是逐个能力手写断言，新增能力不会自动被覆盖。
      - name: Reconcile the marketplace index against the ability packages
        run: npx --yes @vetta-org/plugin-cli@^0.1.1 sync --check
