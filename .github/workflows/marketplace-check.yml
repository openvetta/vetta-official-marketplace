name: Marketplace checks

on:
  push:
    branches: [main, marketplace-v3, refa/marketplace-v3]
  pull_request:
    branches: [main, marketplace-v3, refa/marketplace-v3]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used for a manually dispatched release-candidate check
        required: true
        default: refa/marketplace-v3
        type: string

permissions:
  contents: read

jobs:
  marketplace-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect marketplace schema
        id: schema
        run: |
          version="$(node -p 'require("./.vetta/marketplace.json").schemaVersion')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build schema v3 plugin packages from source
        if: steps.schema.outputs.version == '3'
        shell: bash
        run: |
          node -e "const m=require('./.vetta/marketplace.json'); const a=m.abilities.flatMap(x=>x.type==='plugin'?[x]:x.type==='bundle'?x.config.members.filter(y=>y.type==='plugin'&&y.source):[]); console.log([...new Set(a.map(x=>x.source.path))].join('\n'))" > /tmp/marketplace-plugin-paths
          while IFS= read -r path; do
            (cd "$path" && npm ci && npm run build)
          done < /tmp/marketplace-plugin-paths

      - name: Recreate the schema v3 plugin archives
        if: steps.schema.outputs.version == '3'
        shell: bash
        run: |
          node -e "const m=require('./.vetta/marketplace.json'); const a=m.abilities.flatMap(x=>x.type==='plugin'?[x]:x.type==='bundle'?x.config.members.filter(y=>y.type==='plugin'&&y.source):[]); for(const x of a) console.log(x.slug, x.releases.at(-1).minAppVersion)" > /tmp/marketplace-plugin-releases
          while read -r slug app_version; do
            python3 scripts/stage-plugin-release.py "$slug" --min-app-version "$app_version"
          done < /tmp/marketplace-plugin-releases

      - name: Check every proposed marketplace snapshot
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DISPATCH_BASE_REF: ${{ inputs.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ -n "$DISPATCH_BASE_REF" ]]; then
            git check-ref-format --branch "$DISPATCH_BASE_REF" >/dev/null
            git fetch origin "refs/heads/$DISPATCH_BASE_REF:refs/remotes/origin/$DISPATCH_BASE_REF"
            base_sha="$(git rev-parse "origin/$DISPATCH_BASE_REF")"
          fi
          node scripts/check-marketplace-version.mjs --range "$base_sha" "$HEAD_SHA"

      - name: Test version guard and marketplace contracts
        run: node --test tests/marketplace-version.test.mjs tests/marketplace.test.mjs tests/stage-plugin-release.test.mjs tests/plugin-release-context.test.mjs tests/plugin-release-workflow.test.mjs tests/update-cli-proxy-api.test.mjs

      # 通用身份对账：条目 version 必须等于包里的版本，plugin 的 entry/styles 必须真实存在。
      # 现有 tests/marketplace.test.mjs 是逐个能力手写断言，新增能力不会自动被覆盖。
      - name: Reconcile the marketplace index against the ability packages
        if: steps.schema.outputs.version == '2'
        run: npx --yes @vetta-org/plugin-cli@^0.1.1 sync --check

      - uses: actions/checkout@v4
        if: steps.schema.outputs.version == '3'
        with:
          repository: openvetta/open-vetta
          ref: refa/plugin-marketplace-v3
          path: tooling/open-vetta

      - name: Block unpublished App versions and changed plugin artifacts
        if: steps.schema.outputs.version == '3'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/open-vetta/scripts/release/check-plugin-marketplace-publication.mjs .vetta/marketplace.json
