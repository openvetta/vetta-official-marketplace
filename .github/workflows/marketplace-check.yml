name: Marketplace checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - run: node scripts/marketplace.mjs check
      - run: node --test tests/*.test.mjs
      - name: Build candidate against the current distribution
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach "$RUNNER_TEMP/marketplace-previous" origin/gh-pages
            node scripts/marketplace.mjs build --previous "$RUNNER_TEMP/marketplace-previous"
          else
            node scripts/marketplace.mjs build
          fi
      - name: Resolve publication tool revision
        id: tooling
        run: echo "commit=$(node -p 'require("./.vetta/publish.json").toolingCommit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: openvetta/open-vetta
          ref: ${{ steps.tooling.outputs.commit }}
          path: .tooling/open-vetta
          persist-credentials: false
      - name: Check stable Desktop compatibility and package digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/marketplace.mjs verify
