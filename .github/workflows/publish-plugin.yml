name: Publish plugin release candidate

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Plugin slug registered in the schema v3 marketplace
        required: true
        type: string
      source_ref:
        description: Repository branch containing the plugin source changes
        required: true
        type: string
      base_branch:
        description: Protected marketplace branch that will review the generated PR
        required: true
        default: marketplace-v3
        type: string
      min_app_version:
        description: Optional stable Desktop version; defaults to the marketplace minimum
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: publish-plugin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLUGIN_SLUG: ${{ inputs.slug }}
      SOURCE_REF: ${{ inputs.source_ref }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      MIN_APP_VERSION: ${{ inputs.min_app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the reviewed source branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLUGIN_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || { echo "Invalid plugin slug" >&2; exit 1; }
          git check-ref-format --branch "$SOURCE_REF" >/dev/null
          git check-ref-format --branch "$BASE_BRANCH" >/dev/null
          [[ "$SOURCE_REF" != "$BASE_BRANCH" ]] || { echo "source_ref must be a review branch, not the protected marketplace branch" >&2; exit 1; }
          git fetch origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          base_sha="$(git rev-parse "origin/$BASE_BRANCH")"
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" != "$base_sha" ]] || { echo "source_ref has no changes to review" >&2; exit 1; }
          git merge-base --is-ancestor "$base_sha" "$source_sha" || {
            echo "source_ref must include the latest $BASE_BRANCH before publishing" >&2
            exit 1
          }
          node scripts/check-marketplace-version.mjs --range "$base_sha" "$source_sha"
          expected_repository="$(node -p "require('./.vetta/marketplace.json').repository.replace(/\\/$/, '')")"
          [[ "$expected_repository" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ]] || {
            echo "Marketplace repository does not match $GITHUB_REPOSITORY" >&2
            exit 1
          }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          args=(--slug "$PLUGIN_SLUG")
          if [[ -n "$MIN_APP_VERSION" ]]; then args+=(--min-app-version "$MIN_APP_VERSION"); fi
          node scripts/plugin-release-context.mjs "${args[@]}" > "$RUNNER_TEMP/plugin-release.json"
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(node -e '
            const p = require(process.argv[1]);
            for (const [key, value] of Object.entries(p)) {
              const outputKey = key.replace(/[A-Z]/g, (letter) => `_${letter.toLowerCase()}`);
              console.log(`${outputKey}=${value}`);
            }
          ' "$RUNNER_TEMP/plugin-release.json")

      - name: Install, test, and build the plugin
        working-directory: ${{ steps.release.outputs.source_path }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          npm ci
          npm run check --if-present
          npm test --if-present
          npm run build

      - name: Build the immutable package and stage its catalog record
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage-plugin-release.py "$PLUGIN_SLUG" \
            --min-app-version "${{ steps.release.outputs.min_app_version }}"
          node scripts/stage-v3-catalog.mjs \
            --marketplace-version "${{ steps.release.outputs.marketplace_version }}" \
            --min-app-version "${{ steps.release.outputs.min_app_version }}" \
            --slug "$PLUGIN_SLUG"
          node --test tests/plugin-release-context.test.mjs
          git diff --exit-code -- "${{ steps.release.outputs.source_path }}"

      - name: Create or verify the immutable GitHub Release
        id: published
        shell: bash
        run: |
          set -euo pipefail
          asset=".release-artifacts/${{ steps.release.outputs.asset_name }}"
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            [[ "$target" == "${{ steps.source.outputs.sha }}" ]] || {
              echo "Existing release $tag targets $target instead of the reviewed source commit" >&2
              exit 1
            }
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$tag" --pattern "${{ steps.release.outputs.asset_name }}" \
              --dir "$RUNNER_TEMP/existing-release"
            cmp "$asset" "$RUNNER_TEMP/existing-release/${{ steps.release.outputs.asset_name }}" || {
              echo "Existing release bytes differ; publish a new plugin version" >&2
              exit 1
            }
          else
            notes="CI-built Vetta plugin package for $PLUGIN_SLUG ${{ steps.release.outputs.version }} from commit ${{ steps.source.outputs.sha }}. The marketplace catalog update remains subject to PR review."
            gh release create "$tag" "$asset" \
              --target "${{ steps.source.outputs.sha }}" \
              --title "$PLUGIN_SLUG ${{ steps.release.outputs.version }}" \
              --notes "$notes"
          fi
          sha256sum "$asset"

      - name: Verify Desktop publication compatibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openvetta/open-vetta.git "$RUNNER_TEMP/open-vetta"
          node "$RUNNER_TEMP/open-vetta/scripts/release/check-plugin-marketplace-publication.mjs" \
            .vetta/marketplace.json

      - name: Open a Draft marketplace PR
        id: pull_request
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.release.outputs.release_branch }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Release branch already exists: $branch" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .vetta/marketplace.json
          node scripts/check-marketplace-version.mjs --staged
          git commit \
            -m "chore(marketplace): 登记 $PLUGIN_SLUG ${{ steps.release.outputs.version }}" \
            -m "登记由 CI 从已审查源码构建的不可变 .vettapkg，并推进市场快照版本。"
          git push origin "HEAD:$branch"
          cat > "$RUNNER_TEMP/pull-request.md" <<EOF
          ## Plugin release

          - Plugin: \`$PLUGIN_SLUG\`
          - Version: \`${{ steps.release.outputs.version }}\`
          - Source commit: \`${{ steps.source.outputs.sha }}\`
          - Asset: \`${{ steps.release.outputs.asset_name }}\`
          - Minimum Desktop: \`${{ steps.release.outputs.min_app_version }}\`

          The package was built, tested, uploaded, and verified by CI. This Draft PR must be reviewed
          and pass marketplace publication checks before it is marked ready or merged. No workflow
          will merge it automatically.
          EOF
          url="$(gh pr create --draft \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(marketplace): publish $PLUGIN_SLUG ${{ steps.release.outputs.version }}" \
            --body-file "$RUNNER_TEMP/pull-request.md")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Dispatch marketplace checks for the generated PR commit
        shell: bash
        run: |
          gh workflow run marketplace-check.yml \
            --ref "${{ steps.release.outputs.release_branch }}" \
            -f base_ref="$BASE_BRANCH"
          echo "Draft PR: ${{ steps.pull_request.outputs.url }}"
